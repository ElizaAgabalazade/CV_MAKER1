<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mergen.io</title>
    <link rel="icon" href="img/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signin.css">
</head>
<body>

<div class="wrapper">

    <!-- LEFT SIDE -->
    <div class="left">
        <div class="logo">
            <div class="circle"></div>
            <span>MERGEN.IO</span>
        </div>

        <div class="left-content">
            <h1>Hello,<br>Friend !</h1>
            <p>Join<br><strong>over 100K+</strong><br>professional candidates</p>
        </div>
    </div>


    <!-- RIGHT SIDE -->
    <div class="right">

<a href="register.html" class="nav-back">← Back to <b>Sign in</b></a>

        <div class="form-area">
            <h2>Sign Up via Email</h2>

            <div class="input-box">
                <label>Full Name</label>
                <input type="text">
            </div>

            <div class="input-box">
                <label>Email</label>
                <input type="email">
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password">
            </div>

           <div class="buttons">
    <button type="button" class="btn" onclick="window.location.href='register.html'">Back</button>

    <button type="button" class="btn" onclick="window.location.href='signinstep2.html'">Continue</button>
</div>

            <div class="bottom-text">
                Already Registered? <span>Sign In</span>
            </div>

        </div>

    </div>

</div>

<script src="signin.js"></script>
</body>
</html>
