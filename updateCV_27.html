<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/./updateCV_27.css" />
    <script src="./js/fill_data.js" defer></script>
    <title>Document</title>
</head>

<body>
    <header>
        <div class="header_left">
            <div><a href="./index.html" class="site_name">●MakeCV</a></div>
        </div>
        <div class="header_middle">
            <nav>
                <ul>
                    <li><a href="./update_cv.html">Resume Templates </a></li>
                    <li><a href="./CoverLetter.html">Cover Letter</a> </li>
                    <li><a href="./ATS.html">ATS Checker</a> </li>
                    <li><a href="./PaymentMethods.html">Payment </a></li>
                    <li>About us</li>
                </ul>
            </nav>
        </div>
        <div class="header_right">
            <a href="register.html" class="sign_part">Sign Up</a>
            <a href="/Log_in.html" class="log_in">Log In</a>
        </div>
    </header>
    <section>

        <div class="section_right">
            <h3>Document preview & Editor</h3>
            <div class="section_right_top">
                <div class="section_right_l_side">
                    <div class="section_right_l_side_header">
                        <input type="file" id="fileInput2" accept="image/*">
                        <div class="section_right_l_side_header_left">
                            <form method="POST" class="top_form">
                                <input type="text" id="nameToCV" class="input_h1" placeholder="Luca Ferrari">
                            </form>
                            <div id="qr-result-container">
                                <div id="qr-cv-display"> </div>
                            </div>
                            <hr class="seperate">
                            <div class="section_right_side_2">
                                <p id="aboutMeTextarea"> About Me</p>
                                <textarea class="outputArea" id="autoTextarea" placeholder=" Write here"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="work_experience_right" id="sendedParts">
                        <h2 id="sendTitle">Experience</h2>
                        <form method="post">
                            <ul class="place" id="sendList"></ul>
                        </form>
                    </div>
                    <div class="section_right_top_skills" id="skills_container">
                        <h2>Skills</h2>
                        <ul id="entry_list" class="skill_list_right"></ul>
                    </div>
                    <div class="bothcerstificate_language">
                        <div class="section_right_top_certificat" id="certificate">
                            <h2>Certificate</h2>
                            <ul id="itemListCertificate_right1"></ul>
                        </div>
                        <div class="section_right_top_language" id="language">
                            <h2>Language</h2>
                            <ul id="itemListLanguage_right1"></ul>
                        </div>
                    </div>
                    <div id="rightSideContainer" class="rightSideContainer">
                        <h2 id="sendTitle1">Education</h2>
                        <form method="post">
                            <ul class="place" id="sendList1"></ul>
                        </form>
                    </div>
                </div>
                <div class="info_input">
                    <form method="post">
                        <textarea name="" id="phoneR" placeholder="+123-456-7890"
                            pattern="^\+[0-9]{1,3}\s?[0-9]{1,14}(\s[0-9]{1,13})?$"
                            title="Daxil edin: +<CountryCode> <PhoneNumber>" class="phoneR" required></textarea>
                        <textarea id="emailR" name="email" placeholder="hello@greatsite.com" required
                            class="emailR"></textarea>
                        <textarea id="adressR" name="address" placeholder="123 Anywhere St.,Any City" required
                            class="adressR"></textarea>
                        <textarea id="linkedinR" name="linkedin" placeholder="linkedin.com/in/username"
                            class="linkedinR"></textarea>
                    </form>
                </div>

            </div>
            <div class="button-container">
                <button class="btn btn-change"><a href="./Resume_templates.html">Change Format</a></button>
                <button id="download-pdf" class="btn btn-download">Download</button>
            </div>
        </div>
    </section>
</body>

</html>
