<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/n_p.css">
    <script src="./js/Profile.js" defer></script>
    <title>Document</title>
</head>

<body>
    <section>
        <div class="section_left">
            <div class="section_left_top">
                <h1>Edit Entry</h1>
                <img src="./img/top_img.png" alt="" class="bin">
            </div>


            <div class="information">
                <div class="information_top">
                    <label for="">Information</label><br />
                    <div class="inside_desc">
                        <ul id="iconList">
                            <li><img src="./img/bold.png" alt="" data-action="bold"></li>
                            <li><img src="./img/list.png" alt="" data-action="list"></li>
                            <li><img src="./img/A.png" alt="" data-action="color"></li>
                        </ul>
                        <hr class="hr">
                        <textarea name="" id="targetElement" class="textarea1"
                            placeholder="Enter information or sub skills"></textarea>
                    </div>
                </div>
            </div>

            <div class="left_work">
                <div class="section_left_top_left_work" data-index="0">
                    <label for="">Job Title</label><br />
                    <input type="text" placeholder="Enter job title">
                    <label for="">Place</label><br />
                    <input type="text" placeholder="Enter your which company">
                    <label for="">Location</label><br />
                    <input type="text" placeholder="City, Country">
                </div>
                <div class="section_middle_left_work">
                    <div class="start_left_work">
                        <label for="">Start Date</label><br />
                        <input type="date" name="" id="startDate">
                    </div>
                    <div class="end_left_work">
                        <label for="">End Date</label><br />
                        <input type="date" id="endDate">
                    </div>
                    <div class="stillWorking_left_work">
                        <label for="stillWorkingCheck">still working</label>
                        <input type="checkbox" id="stillWorkingCheck">
                    </div>
                </div>
                <div class="section_left_bottom_left_work">
                    <label for="">Description</label><br />
                    <div class="inside_desc_left_work">
                        <ul id="iconList">
                            <li><img src="./img/bold.png" alt="" data-action="bold"></li>
                            <li><img src="./img/list.png" alt="" data-action="list"></li>
                            <li><img src="./img/A.png" alt="" data-action="color"></li>
                        </ul>
                        <hr class="hr_left_work">
                        <textarea name="" id="targetElement" class="textarea1_left_work"
                            placeholder="Describe your role and achievements"></textarea>
                    </div>
                </div>
            </div>

            <div class="education_part">
                <div class="section_left_top_education">
                    <label for="">Course Title</label><br />
                    <input type="text" placeholder="Enter course title" id="course">
                    <label for="">Institution</label><br />
                    <input type="text" placeholder="Enter institution" id="institution">
                    <label for="">Location</label><br />
                    <input type="text" placeholder="City, Country" id="city">
                </div>
                <div class="section_middle_education">
                    <div class="start">
                        <label for="" id="">Start Date</label><br />
                        <input type="date" id="eduStart">
                    </div>
                    <div class="end">
                        <label for="" id="">End Date</label><br />
                        <input type="date" id="eduEnd">
                    </div>
                </div>
            </div>

            <div class="skills">
                <div class="section_left_skill">
                    <label for="">Skills</label><br />
                    <input type="text" id="enter_your_skill" placeholder="Enter your skill">
                </div>
                <div class="skill_level_skill">
                    <label for="skillLevel">Skill Level</label><br />
                    <select id="skill" name="skillLevel" class="choose_level">
                        <option value="" disabled selected>Select level</option>
                        <option value="beginner">Beginner</option>
                        <option value="amateur">Amateur</option>
                        <option value="competent">Competent</option>
                        <option value="proficient">Proficient</option>
                        <option value="expert">Expert</option>
                    </select>
                </div>
            </div>


            <div class="language">
                <label for="">Language</label><br />
                <input type="text" placeholder="Enter your language">
                <div class="section_left_bottom_language">
                    <div class="skill_level_language">
                        <label for="skillLevel">Language Level</label><br />
                        <select id="skillanguage" name="skillLevel">
                            <option value="" disabled selected>Select level</option>
                            <option value="beginner">Beginner</option>
                            <option value="amateur">Amateur</option>
                            <option value="competent">Competent</option>
                            <option value="proficient">Proficient</option>
                            <option value="expert">Expert</option>
                        </select>
                    </div>
                </div>

            </div>

            <div class="buttons_all">
                <button class="back" id="backBtn">Back</button>
                <button class="done"><img src="./img/white check.png" alt="" class="check_done">Done</button>
                <button class="next" id="nextBtn"> Next</button>
            </div>
        </div>





        <div class="section_right">
            <form action="http://localhost:3000/entries" method="POST" class="section_right_top">
                <input type="text" class="input_h1" placeholder="RICHARD SANCHEZ MARKETING MANAGER" rows="2">
                <hr class="section_right_hr" />
                <div class="info_input">
                    <input type="tel" name="phone" placeholder="+123-456-7890"
                        pattern="^\+[0-9]{1,3}\s?[0-9]{1,14}(\s[0-9]{1,13})?$"
                        title="Daxil edin: +<CountryCode> <PhoneNumber>" required />
                    <input type="email" name="email" placeholder="hello@greatsite.com" required />
                    <input type="text" name="address" placeholder="123 Anywhere St.,Any City" required />
                </div>
            </form>
            <div class="section_right_1">
                <p>PROFILE</p>
                <textarea class="outputArea" id=""
                    placeholder=" Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam quis nostrud exercitation. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam quis nostrud exercitation. Ut enim ad minim veniam quis nostrud exercitation.">
                </textarea>
                <hr class="section_right_hr" />
            </div>
            <div class="work_experience_right">
                <h2>WORK EXPERIENCE</h2>
                <form action="" method="post">
                    <input type="text" placeholder="place" class="place">
                    <input type="text" placeholder="situation" class="situation">
                    <input type="text" placeholder="Position" class="position">
                </form>
                <div class="work_experience_right_exp">
                    <input type="text" id="list_experience" placeholder="Yazıb Enter basın" class="list_input" />
                    <ul id="itemList"></ul>
                </div>
                <hr class="section_right_hr" />
            </div>
            <div class="education_right">
                <h2>Education</h2>
                <form id="educationForm" action="" method="post">
                    <input type="text" placeholder="place" class="place">
                    <input type="text" placeholder="situation" class="situation">
                    <input type="text" placeholder="Position" class="position">
                </form>
                <hr class="section_right_hr" />
            </div>
             <div class="right_skills">
                <h2>Skills</h2>
                <input type="text" id="list_skill" placeholder="Yazıb Enter basın" class="list_input" />
                <ul id="skill_list"></ul>
                        <hr class="hr_left_work">

            </div>
              <div class="language_right">
                <h2>Language</h2>
                <input type="text" id="list_language" placeholder="Yazıb Enter basın" class="list_input" />
                <ul id="itemListLanguage" class="itemlistLanguage"></ul>
                        <hr class="hr_left_work">

            </div>
            



        </div>
    </section>
</body>

</html>
