<body>
    <header>
        <div class="header_left">
            <div><a href="./index.html" class="site_name">●MakeCV</a></div>
        </div>
        <div class="header_middle">
            <nav>
                <ul>
                    <li><a href="./Resume_templates.html">Resume Templates </a></li>
                    <li><a href="./CoverLetter.html">Cover Letter</a> </li>
                    <li><a href="./ATS.html">ATS Checker</a> </li>
                    <li><a href="./PaymentMethods.html">Payment </a></li>

    <section>
        <div class="section_1_2">
            <div class="section_1">
                <div class="site_name1">● <span>MakeCV</span></div>
                <button type="button" id="upload-cv-btn" class="generate-btn" style="margin-left: 0; width: auto;">
                    Upload CV
                </button>
            </div>
            <div class="section_2" id="section_2">
                <p>Generate yor Cover Letter with AI </p>
                <textarea name="" id="job-description"
                    placeholder="Enter your personal details, job role, and any specific experience you want to highlight... "></textarea>
                <button type="button" id="generate-btn" class="generate-btn">
                    <strong>Generate</strong> with AI
                </button>
            </div>
        </div>
        <div id="upload-modal" class="modal-overlay">
            <div class="modal-content">
                <div class="inside_box">
                    <span class="close-modal">&times;</span>
                    <div class="modal-body">
                        <div class="upload-box" onclick="document.getElementById('file-input').click()">
                            <img src="./img/CoverLetter/plus.png" alt="" class="plus_click">
                            <input type="file" id="file-input" hidden accept=".pdf,.doc,.docx">
                        </div>

                        <hr class="hr">

                        <div class="saved-cvs">
                            <ul id="cv-list">

                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="design-container" class="theme-default">
            <div class="designs_header">
                <h3>Document preview & Editor</h3>
                <div class="designs_header_right">
                    <button type="submit" class="download" id="downloadCoverLetter">Download</button>
                    <button type="button" id="change-design" class="edit_adjust">Change Design</button>
                </div>
            </div>

            <!-- DEFAULT THEME  -->
            <div class="default-theme-block">
                <div class="default-page">
                    <div class="default-left-border"></div>

                    <div class="default-content">
                        <div class="default-header-blue-box">
                            <textarea class="default-date-input date" rows="1">February 26, 2035</textarea>

                            <div class="default-recipient-info">
                                <textarea class="default-bold-textarea recipient name1" rows="1">Dario Amodei</textarea>
                            </div>
                        </div>

                        <div class="default-body">
                            <textarea class="overall cv-editor"
                                placeholder="I am writing to express my profound interest..."></textarea>
                        </div>
                        <div class="default-bottom-contacts">
                            <textarea class="bottom-contact-item email">ingrid.schneider.esg@global.com</textarea>
                            <textarea class="bottom-contact-item phone">+1 (917) 555-0777</textarea>
                            <textarea class="bottom-contact-item address">New York, NY</textarea>
                            <textarea class="bottom-contact-item linkedin">linkedin.com/in/...</textarea>
                        </div>
                    </div>
                </div>
            </div>
            <!-- MODERN THEME  -->
            <div class="modern-theme-block">
                <div class="modern-sidebar"></div>
                <div class="modern-inner">
                    <div class="modern-header">
                        <div class="modern-name-box">
                            <textarea class="modern-name-editor name1" rows="1">AMELIA DUPONT</textarea>
                        </div>
                        <div class="modern-contact-box">
                            <textarea class="modern-contact-item address" rows="1">Lyon, France</textarea>
                            <textarea class="modern-contact-item phone" rows="1">+33 6 45 22 91 78</textarea>
                            <textarea class="modern-contact-item email" rows="1">amelia.dupont@example.com</textarea>
                            <textarea class="modern-contact-item linkedn" rows="1">amelia-dupont-pr</textarea>
                        </div>
                    </div>

                    <div class="modern-body">
                        <textarea class="modern-date-editor date" rows="1">12/12/2026</textarea>
                        <textarea class="modern-overall cv-editor"
                            placeholder="I am writing to express my enthusiasm..."></textarea>

                    </div>
                </div>
            </div>
            <div class="elegant-theme-block">
                <div class="elegant-page">
                    <div class="elegant-header-row">
                        <div class="elegant-contact-col">
                            <textarea class="elegant-contact-item email"
                                rows="1">ines.costa.marketing@example.com</textarea>
                            <textarea class="elegant-contact-item phone" rows="1">+351 914 221 540</textarea>
                        </div>
                        <div class="elegant-name-col">
                            <textarea class="elegant-name-edito name1" rows="1">INÊS COSTA</textarea>

                    </div>

                    <div class="elegant-body">
                        <div class="elegant-date-line">

                        </div>

                    </div>


                </div>

                            <div class="corporate-closing">

                            </div>
                        </div>
                    </div>
                </div>
            </div>

                            <div class="recipient-details">
                                <textarea class="recipient-editor address  " rows="1"></textarea>
                                <textarea class="recipient-editor phone " rows="1"></textarea>

                            <textarea class="minimalist-overall cv-editor"
                                placeholder="Customer retention is the heartbeat of sustainable business growth..."></textarea>
                            <div class="minimalist-footer">
                                <textarea class="minimalist-closing-editor" rows="2">Warm regards</textarea>
                            </div>

                    <div class="minimalist-sidebar">

                                <strong>Phone</strong>

                            </div>
                            <div class="contact-item">
                                <strong>Email</strong>
                                <textarea class="sidebar-contact-editor email"

                            <div class="contact-item">

                            </div>

Hiring Manager</textarea>

                            <div class="ms-recipient-box">
                                <textarea class="ms-bold-editor name1" rows="2">Dario Amodei
Hiring Manager</textarea>

548 Market St, San Francisco, CA 94104, USA</textarea>
