<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<link rel="stylesheet" href="linkedin.css">
</head>
<body>

<div class="wrapper">

    <!-- LEFT -->
    <div class="left">
        <div class="logo">
            <div class="circle"></div>
            <span>MERGEN.IO</span>
        </div>

        <div class="left-content">
            <h1>Hello,<br>Friend !</h1>
            <p>Join<br>over 100k+<br>professional candidates</p>
        </div>
    </div>

    <!-- RIGHT -->
    <div class="right">

        <a href="register.html" class="nav-back">← Back to <b>Sign in</b></a>

        <div class="form-area">
            <h2>Welcome Back to <span class="linkedin">LinkedIn</span></h2>
            <p class="sub">
                Don't miss your next opportunity. Sign in to stay
                updated on your professional world.
            </p>

            <input type="text" placeholder="Email or Phone" class="input">
            
            <div class="password-box">
                <input type="password" placeholder="Password" id="password" class="input">
                <span class="show" onclick="togglePassword()">Show</span>
            </div>

            <div class="buttons">
                <button class="btn cancel">Cancel</button>
                <button class="btn signin">Sign In</button>
            </div>

            <p class="forgot">Forgot password?</p>

            <p class="join">
                New to LinkedIn? <span>Join now</span>
            </p>

            <p class="bottom-text">
                Already Registered? <span>Sign In</span>
            </p>

        </div>

    </div>

</div>



<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    background:linear-gradient(135deg,#e9edf3 0%,#cdd8e6 100%);
}

.wrapper{
    display:flex;
    height:100vh;
}

/* LEFT */
.left{
    width:50%;
    padding:60px;
    position:relative;
    display:flex;
    align-items:center;
}

.logo{
    position:absolute;
    top:40px;
    left:60px;
    display:flex;
    align-items:center;
    gap:12px;
}

.circle{
    width:50px;
    height:50px;
    background:black;
    border-radius:50%;
}

.logo span{
    font-weight:600;
    font-size:22px;
    color:#3c5bff;
}

.left-content h1{
    font-size:60px;
    color:#b8b8b8;
    line-height:1.1;
}

.left-content p{
    margin-top:30px;
    font-size:22px;
    color:#b8b8b8;
}

/* RIGHT */
.right{
    width:50%;
    padding:80px;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

.nav-back{
    position:absolute;
    top:40px;
    left:60px;
    font-size:15px;
    color:#555;
    text-decoration:none;
}

.form-area{
    width:100%;
    max-width:460px;
}

.linkedin{
    background:#0a66c2;
    color:white;
    padding:3px 6px;
    border-radius:4px;
}

.sub{
    color:#777;
    margin:15px 0 30px 0;
}

/* INPUT */
.input{
    width:100%;
    padding:18px;
    margin-bottom:20px;
    border-radius:15px;
    border:2px solid #ccc;
    font-size:15px;
    outline:none;
}

.input:focus{
    border:2px solid #0a66c2;
}

/* PASSWORD */
.password-box{
    position:relative;
}

.show{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    color:#0a66c2;
    cursor:pointer;
    font-weight:500;
}

/* BUTTONS */
.buttons{
    display:flex;
    gap:20px;
    margin-top:10px;
}

.btn{
    flex:1;
    padding:16px;
    border-radius:35px;
    font-size:15px;
    cursor:pointer;
    border:none;
    box-shadow:0 6px 12px rgba(0,0,0,0.2);
}

.cancel{
    background:white;
    border:2px solid #0a66c2;
    color:#0a66c2;
}

.signin{
    background:#0a66c2;
    color:white;
}

.forgot{
    margin-top:20px;
    color:#0a66c2;
    cursor:pointer;
}

.join{
    margin-top:20px;
}

.join span{
    color:#0a66c2;
    font-weight:500;
    cursor:pointer;
}

.bottom-text{
    margin-top:30px;
    color:#999;
}
</style>

<script>
    function togglePassword(){
    const pass = document.getElementById("password");
    if(pass.type === "password"){
        pass.type = "text";
    }else{
        pass.type = "password";
    }
}


</script>
</body>
</html>
