<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/New_Custom_Section2.css">
    <script src="./js/New_Custom_Section.js" defer></script>
    <title>Document</title>
</head>

<body>
    <section>
        <div class="section_left">
            <div class="section_left_top">
                <h1>Edit Entry</h1>
                <img src="./img/top_img.png" alt="" class="bin">
                <label for="">New Custom Section</label><br />
                <input type="text">
                <label for="">Type</label><br />
                <div class="switch">
                    <p class="tab" data-type="normal">Normal</p>
                    <p class="tab" data-type="skills">Skills</p>
                </div>
                <label for="">Course Title</label><br />
                <input type="text" placeholder="Enter job title">
                <label for="">Institution</label><br />
                <input type="text" placeholder="Enter institution">
                 <label for="">Location</label><br />
                <input type="text" placeholder="City, Country">
            </div>
            <div class="section_middle">
                <div class="start">
                    <label for="">Start Date</label><br />
                    <input type="date" name="" id="">
                </div>
                <div class="end">
                    <label for="">End Date</label><br />
                    <input type="date" name="" id="">
                </div>
            </div>
            <div class="section_left_bottom">
                <label for="">Description</label><br />
                <div class="inside_desc">
                    <ul id="iconList">
                        <li><img src="./img/bold.png" alt="" data-action="bold"></li>
                        <li><img src="./img/list.png" alt="" data-action="list"></li>
                        <li><img src="./img/A.png" alt="" data-action="color"></li>
                    </ul>
                    <hr class="hr">
                    <textarea name="" id="targetElement" class="textarea1"
                        placeholder="Describe your role and achievements"></textarea>
                </div>



            </div>
            <button class="done"><img src="./img/white check.png" alt="" class="check_done">Done</button>

        </div>
        <div class="section_right">
            <img src="./img/canva-big version.png" alt="">
        </div>


    </section>
</body>

</html>
