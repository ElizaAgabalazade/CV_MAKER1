<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mergen.io</title>
    <link rel="icon" href="img/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>









    <a href="/Log_in.html" class="nav-back">Back to Sign in</a>





    <div class="wrapper">

        <!-- LEFT SIDE -->
        <div class="left">
            <div class="logo">
                <div class="circle"></div>
                <a href="index.html"><span>MakeCV</span></a>
            </div>

            <div class="left-content">
                <h1>Hello,<br>Friend !</h1>
                <p>Join<br><strong>over 100K+</strong><br>professional candidates</p>
            </div>
        </div>


        <!-- RIGHT SIDE -->
        <div class="right">


            <div class="form-area">
                <h2>Sign Up via Email</h2>

                <div class="input-box">
                    <label>Full Name</label>
                    <input type="text" id="username">
                </div>

                <div class="input-box">
                    <label>Email</label>
                    <input type="email" id="email">
                </div>

                <div class="input-box">
                    <label>Password</label>
                    <input type="password" id="password">
                </div>

                <div class="buttons">
                    <button type="button" class="btn" onclick="window.location.href='register.html'">Back</button>
                    <button type="button" class="btn" id="openModal">Continue</button>
                </div>


                <!-- Verification Modal Overlay -->
                <div class="modal-overlay" id="modalOverlay" aria-modal="true" role="dialog"
                    aria-labelledby="modalTitle">
                    <div class="modal-card">
                        <!-- Close button -->
                        <button class="modal-close" id="closeModal" aria-label="Close">&#x2715;</button>

                        <h2 class="modal-title" id="modalTitle">Verify Email</h2>
                        <p class="modal-subtitle">
                            We have sent a 6-digit code to<br />
                            <strong></strong>
                        </p>

                        <!-- OTP inputs -->
                        <div class="otp-row" id="otpRow">
                            <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*"
                                aria-label="Digit 1" />
                            <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*"
                                aria-label="Digit 2" />
                            <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*"
                                aria-label="Digit 3" />
                            <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*"
                                aria-label="Digit 4" />
                            <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*"
                                aria-label="Digit 5" />
                            <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*"
                                aria-label="Digit 6" />
                        </div>

                        <button class="btn-confirm" type="button">Confirm</button>

                        <button class="btn-resend" type="button">Resend Verification Code</button>
                    </div>
                </div>

                <div class="bottom-text">
                    Already Registered? <span>Sign In</span>
                </div>

            </div>

        </div>

    </div>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            width: 100%;
            background: linear-gradient(135deg, #eef1f5 0%, #dbe4ef 50%, #cfd9e6 100%);
        }

        .wrapper {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* LEFT */
        .left {
            width: 50%;
            min-height: 100vh;
            padding: 60px;
            position: relative;
            display: flex;
            align-items: center;
        }

        .logo {
            position: absolute;
            top: 40px;
            left: 60px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .circle {
            width: 48px;
            height: 48px;
            background: black;
            border-radius: 50%;
        }

        .logo span {
            font-weight: 600;
            font-size: 22px;
            color: #3c5bff;
        }

        .left-content h1 {
            font-size: clamp(50px, 10vw, 100px);
            color: #b8b8b8;
            font-weight: 700;
            line-height: 1.1;
            margin-left: 160px;
        }

        .left-content p {
            margin-top: 50px;
            font-size: 34px;
            color: #b8b8b8;
            line-height: 1.4;
            margin-left: 300px;
        }

        .left-content strong {
            font-weight: 900;
        }

        /* RIGHT */
        .right {
            width: 50%;
            padding: 80px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 100px;
            margin-bottom: 10px;
        }


        .nav-back {
            position: absolute;
            /* və ya fixed */
            top: 10px;
            left: 20px;
            pointer-events: auto;
            position: fixed;
            top: 10px;
            left: 0;
            z-index: 9999;
            display: inline-block;
            padding: 10px 16px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.3s;
        }

        .nav-back:hover {
            background-color: #0056b3;
        }

        .step-box {
            position: absolute;
            top: 40px;
            right: 60px;
            padding: 6px 16px;
            border: 1px solid #aaa;
            border-radius: 15px;
            font-size: 14px;
            color: #555;
        }

        .form-area {
            width: 100%;
            max-width: 420px;
        }

        .form-area h2 {
            margin-bottom: 45px;
            font-size: 28px;
            font-weight: 500;
        }

        .input-box {
            margin-bottom: 28px;
        }

        .input-box label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #8a8a8a;
        }

        .input-box input {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 35px;
            background: #f5f5f5;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
            outline: none;
            font-size: 14px;
        }

        /* BUTTONS */
        .buttons {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 35px;
            background: black;
            color: white;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.25);
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* BOTTOM */
        .bottom-text {
            margin-top: 30px;
            font-size: 14px;
            color: #9a9a9a;
        }

        .bottom-text span {
            color: black;
            cursor: pointer;
            font-weight: 500;
        }

        /* RESPONSIVE */
        @media(max-width:1000px) {
            .left {
                display: none;
            }

            .right {
                width: 100%;
            }
        }

        /* ── Modal overlay ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.is-open {
            opacity: 1;
            pointer-events: all;
        }

        /* ── Modal card ── */
        .modal-card {
            background: #E0EFFF;
            border-radius: 24px;
            padding: 40px 36px 32px;
            width: 543px;
            max-width: calc(100vw - 32px);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            transform: translateY(12px);
            transition: transform 0.22s ease;
        }

        .modal-overlay.is-open .modal-card {
            transform: translateY(0);
        }

        /* ── Close button ── */
        .modal-close {
            position: absolute;
            top: 16px;
            right: 18px;
            background: none;
            border: none;
            font-size: 18px;
            color: #8a96a3;
            cursor: pointer;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.15s, color 0.15s;
        }

        .modal-close:hover {
            background: rgba(0, 0, 0, 0.06);
            color: #474B50;
        }

        /* ── Modal title ── */
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #474B50;
            margin-bottom: 10px;
            text-align: center;
        }

        /* ── Modal subtitle ── */
        .modal-subtitle {
            font-size: 15px;
            color: #C6CED8;
            font-weight: 400;
            text-align: center;
            line-height: 1.55;
            margin-bottom: 28px;
        }

        .modal-subtitle strong {
            color: #474B50;
            font-weight: 700;
        }

        /* ── OTP row ── */
        .otp-row {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .otp-input {
            width: 51px;
            height: 53px;
            border: 1px solid #D8E1EB;
            border-radius: 18px;
            background: #ffffff;
            text-align: center;
            font-size: 20px;
            font-family: inherit;
            font-weight: 700;
            color: #474B50;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            caret-color: #A9A8FE;
        }

        .otp-input:focus {
            border-color: #A9A8FE;
            box-shadow: 0 0 0 3px rgba(169, 168, 254, 0.2);
        }

        /* ── Confirm button ── */
        .btn-confirm {
            background: #000000;
            color: #ffffff;
            border: none;
            border-radius: 15px;
            width: 157px;
            height: 43px;
            font-size: 14px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 20px;
        }

        .btn-confirm:hover {
            opacity: 0.85;
        }

        /* ── Resend link ── */
        .btn-resend {
            background: none;
            border: none;
            font-size: 10px;
            font-family: inherit;
            color: #A9A8FE;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn-resend:hover {
            opacity: 0.75;
            text-decoration: underline;
        }



























        /*RESPONSIVE*/


        .wrapper {
            display: flex;
            flex-wrap: nowrap;
        }


        .right {
            margin-right: 0;
            padding: clamp(20px, 5vw, 80px);
        }


        .left-content h1 {
            margin-left: clamp(20px, 10vw, 160px);
        }

        .left-content p {
            margin-left: clamp(20px, 15vw, 300px);
        }

        /*TABLET */
        @media(max-width:1200px) {

            .left {
                padding: 40px;
            }

            .left-content h1 {
                font-size: clamp(40px, 6vw, 70px);
            }

            .left-content p {
                font-size: clamp(18px, 2.5vw, 28px);
                margin-left: clamp(20px, 10vw, 150px);
            }

            .right {
                padding: 40px;
            }
        }

        /*SMALL LAPTOP*/
        @media(max-width:1024px) {

            .wrapper {
                flex-direction: row;
            }

            .left {
                width: 50%;
            }

            .right {
                width: 50%;
                padding: 30px;
            }

            .form-area {
                max-width: 350px;
            }
        }

        /*MOBILE*/
        @media(max-width:768px) {

            .wrapper {
                flex-direction: column;
                /* artıq alt-üst */
            }

            .left {
                display: none;
                /* mobildə gizlənir */
            }

            .right {
                width: 100%;
                padding: 20px;
                align-items: flex-start;
            }

            .form-area {
                max-width: 100%;
            }

            .buttons {
                flex-direction: column;
            }
        }


        @media(max-width:480px) {

            .right {
                padding: 15px;
            }

            .nav-back {
                left: 20px;
                top: 20px;
            }

            .form-area h2 {
                font-size: 22px;
            }

            .input-box input {
                padding: 14px;
            }
        }

        /* MODAL RESPONSIVE */
        @media(max-width:600px) {

            .modal-card {
                width: 95%;
                padding: 25px;
            }

            .otp-row {
                gap: 6px;
            }

            .otp-input {
                width: 40px;
                height: 45px;
            }
        }
    </style>

    <script src="js/register.js"></script>
</body>

</html>
