 .personaldetail{

.name {

.profile-box {

.badge {

.dropdown {

#documents {

    display: flex;
    flex-direction: column;
    align-items: center;

}

.upload-btn {
    padding: 10px 20px;

    color: white;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 20px;
}

input[type="file"] {
    display: none;
}

/* GRID FLEX */
#previewBox {
    width: 100%;
    max-width: 900px;

    display: flex;
    flex-wrap: wrap;
    gap: 15px;

    justify-content: flex-start;

}

.file-card {
    width: 140px;
    flex: 0 0 auto;

    border: 1px solid #ccc;
    border-radius: 10px;
    background: white;
    text-align: center;
}

.file-card img {
    width: 100%;
    border-radius: 8px;
}

.file-name {
