<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./js/CV_register.js" defer></script>
    <link rel="stylesheet" href="./css/CV_register.css">
    <link rel="icon" href="img/logo.png">
    <title>Document</title>
</head>

<body>
    <section>
        <div class="section_left">
            <h1>Hello, Friend !</h1>
            <p>Enter your personal details and start </p>
            <button class="btn">SIGN UP</button>

        </div>
        <div class="section_right">
            <div class="section_right_1">
                <div class="border-wrapper">
                    <div class="inner-box">
                        <a href="">
                            <img src="./img/google-logo 1.png" alt="">
                            Continue with Google</a>
                    </div>
                </div>
                <form action="" method="post">
                    <div class="section_right_2">
                        <input type="text" id="usernameInput" placeholder="Username">
                        <input type="email" id="emailInput" placeholder="Email">
                        <input type="password" id="passwordInput" placeholder="Password">
                    </div>
                    <div class="section_right_3">
                        <a href="./forgot_password.html" class="link_to_forgot"> Forgot your password ?</a>
                        <button id="signInBtn" type="button">
                            SIGN IN
                        </button>
                        <a href="./Log_in.html" class="log_in">LOG IN</a>
                    </div>
                </form>
                <div class="actions">
                    <div class="back">
                        <button>
                            <a href="#">Back</a>
                        </button>
                    </div>
                    <div class="next">
                        <button>
                            <a href="#l">Next</a>
                        </button>
                    </div>
                </div>



            </div>
    </section>
</body>

</html>
