<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./js/fill_data.js" defer></script>
    <link rel="stylesheet" href="./css/updateCV_44.css"/>
    <title>Ats ink classic</title>
</head>
<body>
      <header>
        <div class="header_left">
            <div><a href="./index.html" class="site_name">●MakeCV</a></div>
        </div>
        <div class="header_middle">
            <nav>
                <ul>
                    <li><a href="./update_cv.html">Resume Templates </a></li>
                    <li><a href="./CoverLetter.html">Cover Letter</a> </li>
                    <li><a href="./ATS.html">ATS Checker</a> </li>
                    <li><a href="./PaymentMethods.html">Payment </a></li>
                    <li>About us</li>
                </ul>
            </nav>
        </div>
        <div class="header_right">
            <a href="register.html" class="sign_part">Sign Up</a>
            <a href="/Log_in.html" class="log_in">Log In</a>
        </div>
    </header>
      <div class="section_right">
            <h3>Document preview & Editor</h3>
            <div class="section_right_top">
                <div class="section_right_top_header">
                    <div class="section_right_top_header_inside">
                        <div class="header-info">
                            <textarea id="nameToCV" class="input_h1" placeholder="Sofia Moretti"></textarea>

                            <div id="qr-result-container">
                                <div id="qr-cv-display"></div>
                            </div>
                        </div>
                        <div class="photo-section">
                            <div class="contact-info">
                                <textarea id="phoneR" placeholder="+44 7700 900777"></textarea>
                                <textarea id="emailR" placeholder="s.moretti@legalbrand.co.uk"></textarea>
                                <textarea id="adressR" placeholder="London, UK"></textarea>
                                <textarea id="linkedinR" placeholder="linkedin.com/in/sofiamoretti"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="section_right_side_2">
                    <p id="aboutMeTextarea"> Summary</p>
                    <textarea class="outputArea" id="autoTextarea" placeholder="Write here..."></textarea>
                </div>
                <div class="section_right_top_sides">
                    <div class="section_right_top_sides_left">
                        <div class="work_experience_right" id="sendedParts">
                            <h2 id="sendTitle">Professional Experience</h2>
                            <form method="post">
                                <ul class="place" id="sendList">
                                </ul>
                            </form>
                        </div>
                    </div>
                    <div class="section_right_top_sides_right">
                        <div class="section_right_top_education_certificate_skills">
                            <div class="certificate_education">
                                <div class="section_right_top_certificat" id="certificate">
                                    <h2>Certifications</h2>
                                    <ul id="itemListCertificate_right1"></ul>
                                </div>
                                <div class="skills">
                                    <div class="section_right_top_skills" id="skills_container">
                                        <h2>Skills</h2>
                                        <ul id="entry_list" class="skill_list_right"></ul>
                                    </div>
                                </div>

                                <div id="rightSideContainer" class="rightSideContainer">
                                    <h2 id="sendTitle1">Education</h2>
                                    <form method="post">
                                        <ul class="place" id="sendList1"></ul>
                                    </form>
                                </div>
                            </div>

                        </div>
                        <div class="section_right_top_language" id="language">
                            <div class="section_right_top_language_inside">
                                <h2>Language</h2>
                                <ul id="itemListLanguage_right1"></ul>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
            <div class="button-container">
                <button class="btn btn-change" id="changeFormat"><a href="./Resume_templates.html">Change
                        Format</a></button>
                <button id="download-pdf" class="btn btn-download">Download</button>
            </div>
<!-- end -->
        </div>
</body>
</html>
