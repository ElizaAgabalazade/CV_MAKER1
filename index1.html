<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/A_I_P.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="./js/A_I_P.js" defer></script>
    <title>Information</title>
</head>

<body>
    <header>
        <div class="logo">
            <img src="./img/logo155.png" alt="" class="bubble">
            <img src="./img/CV Maker..png" alt="" class="word">
            <img src="./img/check_icon.png" alt="" class="check">

        </div>
        <div class="nav">
            <nav>
                <ul>
                    <li>
                        <a href="./index.html">Home</a>
                    </li>
                    <li>
                        <a href="./About.html">About</a>
                    </li>
                    <li>
                        <a href="./Last_Page.html">Payment</a>
                    </li>
                </ul>
            </nav>
        </div>
        <div class="sign_log">
            <a href="./Log_in.html"><img src="./img/Generic avatar.png" alt=""></a>
        </div>
    </header>
    <section>
        <div class="section_1">
            <div class="section_1_1">
                <div class="section__top">
                    <input type="text" id="nameInput" placeholder="Your name" readonly>
                    <img id="editIcon" src="./img/pen.png" alt="">
                </div>
                <div class="section__bottom">
                    <div class="section__bottom_left">
                        <form action="" method="post">
                            <input type="email" name="" id="" placeholder="E-mail">
                            <img src="./img/Icon button mail - standard.png" alt="" class="mail">
                            <img src="./img/Icon button phone- standard.png" alt="" class="phone">
                            <input type="tel" name="phone" placeholder="Phone"
                                pattern="^\+[0-9]{1,3}\s?[0-9]{1,14}(\s[0-9]{1,13})?$"
                                title="Daxil edin: +<CountryCode> <PhoneNumber>" required>
                            <img src="./img/Icon button gps - standard.png" alt="" class="gps"><input type="text"
                                placeholder="Address">
                        </form>
                    </div>
                    <div class="section__bottom_right" id="uploadBox">
                        <img id="preview" src="./img/Icon button togglable - standard.png" alt="upload icon">
                    </div>
                    <input type="file" id="fileInput" accept="image/*">
                </div>
            </div>
            <div class="section_1_2">
                <form action="" method="post">
                    <label for="Profile" class="profile_label">Profile</label>
                    <input type="text" placeholder="New Entry" class="profile_input" />
                    <button class="edit_btn">Edit <img src="./img/Icon pen blue .png" alt=""></button>
                    <input type="text" placeholder="New Entry" class="new_entry" />
                    <button type="button" class="add_entry_btn">Add Entry</button>
                    <img src="./img/arrow small - standard.png" alt="" class="arrow_click" />
                </form>
            </div>
            <div class="section_1_2">
                <form action="" method="post">
                    <label for="Profile" class="profile_label">Professional Experience</label>
                    <input type="text" placeholder="New Entry" class="profile_input" />
                    <button class="edit_btn">Edit <img src="./img/Icon pen blue .png" alt=""></button>
                    <input type="text" placeholder="New Entry" class="new_entry" />
                    <button type="button" class="add_entry_btn">Add Entry</button>
                    <img src="./img/arrow small - standard.png" alt="" class="arrow_click" />
                </form>
            </div>
            <div class="section_1_2">
                <form action="" method="post">
                    <label for="Profile" class="profile_label">Education</label>
                    <input type="text" placeholder="New Entry" class="profile_input" />
                    <button class="edit_btn">Edit <img src="./img/Icon pen blue .png" alt=""></button>
                    <input type="text" placeholder="New Entry" class="new_entry" />
                    <button type="button" class="add_entry_btn">Add Entry</button>
                    <img src="./img/arrow small - standard.png" alt="" class="arrow_click" />
                </form>
            </div>
            <div class="section_1_2">
                <form action="" method="post">
                    <label for="Profile" class="profile_label">Courses</label>
                    <input type="text" placeholder="New Entry" class="profile_input" />
                    <button class="edit_btn">Edit <img src="./img/Icon pen blue .png" alt=""></button>
                    <input type="text" placeholder="New Entry" class="new_entry" />
                    <button type="button" class="add_entry_btn">Add Entry</button>
                    <img src="./img/arrow small - standard.png" alt="" class="arrow_click" />
                </form>
            </div>
            <div class="section_1_2">
                <form action="" method="post">
                    <label for="Profile" class="profile_label">Certificates</label>
                    <input type="text" placeholder="New Entry" class="profile_input" />
                    <button class="edit_btn">Edit <img src="./img/Icon pen blue .png" alt=""></button>
                    <input type="text" placeholder="New Entry" class="new_entry" />
                    <button type="button" class="add_entry_btn">Add Entry</button>
                    <img src="./img/arrow small - standard.png" alt="" class="arrow_click" />
                </form>
            </div>
        </div>

        <div class="section2">
            <div class="section2_top">
                <img src="./img/canva-big version.png" alt="">
            </div>
            <div class="section2_bottom">
                <ul>
                    <li><a href="">Custom</a></li>
                    <li> <a href="">Add Content</a></li>
                    <li><a href="">CV with AI</a></li>
                    <li><a href="">View</a></li>
                </ul>
            </div>
        </div>
    </section>
</body>

</html>
